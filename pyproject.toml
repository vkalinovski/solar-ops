[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarflare-app"
version = "1.0.0"
description = "M1+ solar flare onset forecasting with calibrated CatBoost ensembles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "catboost==1.2.7",
  "fastapi==0.115.0",
  "matplotlib==3.9.2",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow==17.0.0",
  "requests==2.32.3",
  "scikit-learn==1.5.2",
  "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["solarflare_app*"]
